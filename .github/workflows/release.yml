name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    # GITHUB_TOKEN commits do not re-trigger workflows; this is an extra guard.
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bump version
        id: version
        run: |
          VERSION=$(node scripts/bump-version.mjs --bump)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumped to $VERSION"

      - name: Build XPI package
        run: bash scripts/build-gear-xpi.sh

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Keep the XPI on main so Gear can fetch it from raw.githubusercontent.com
          # without following GitHub release-asset redirects (those break ZIPFoundation).
          git add twitter-position-saver.user.js gear-extension/manifest.json \
            twitter-position-saver-gear.xpi updates.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]"
          git pull --rebase origin main
          git push

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            twitter-position-saver-gear.xpi
            twitter-position-saver.user.js
