<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timeline Position Saver</title>
  <style>
    body {
      font: 14px/1.4 system-ui, -apple-system, sans-serif;
      margin: 12px;
      max-width: 320px;
    }
    h1 { font-size: 16px; margin: 0 0 8px; }
    p { margin: 0 0 10px; color: #444; }
    button {
      width: 100%;
      padding: 10px;
      border: 0;
      border-radius: 8px;
      background: #1d9bf0;
      color: #fff;
      font: inherit;
      font-weight: 600;
    }
    #status { margin-top: 10px; min-height: 1.2em; }
  </style>
</head>
<body>
  <h1>Timeline Position Saver</h1>
  <p>Na Gear iOS najpierw wlacz dostep do x.com, potem odswiez strone.</p>
  <button id="enable" type="button">Wlacz na x.com</button>
  <p id="status"></p>
  <p>Po wlaczeniu powinny pojawic sie niebieskie przyciski po prawej stronie timeline.</p>
  <script>
    const status = document.getElementById('status');
    const api = globalThis.browser || globalThis.chrome;

    document.getElementById('enable').addEventListener('click', () => {
      if (!api?.permissions?.request) {
        status.textContent = 'Wlacz recznie w ustawieniach rozszerzenia: Zezwol na x.com.';
        return;
      }

      api.permissions.request({
        origins: ['https://x.com/*', 'https://twitter.com/*']
      }, (granted) => {
        status.textContent = granted
          ? 'OK. Odswiez x.com.'
          : 'Odmowiono. Zezwol recznie w ustawieniach rozszerzenia.';
      });
    });
  </script>
</body>
</html>
